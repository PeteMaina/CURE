services:
  postgres:
    image: postgres:16
    container_name: cure-postgres
    environment:
      POSTGRES_DB: cure
      POSTGRES_USER: cure
      POSTGRES_PASSWORD: cure
    ports:
      - "5432:5432"
    volumes:
      - cure-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cure -d cure"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: cure-redis
    ports:
      - "6379:6379"
    volumes:
      - cure-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cure-postgres-data:
  cure-redis-data:
